[package]
name = "probe"
version = "0.1.0"
edition = "2024"
description = "Этап 1: проверка связи и передачи файла между двумя ПК через интернет"

[[bin]]
name = "obshaya-test"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
iroh = "1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }

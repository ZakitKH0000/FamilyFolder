[package]
name = "obshaya-core"
version = "1.4.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
chacha20poly1305 = "0.10"
data-encoding = "2.11.1"
getrandom = "0.3"
iroh = "1.3.0"
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "query", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
trash = "5"
uuid = { version = "1.26.1", features = ["v4"] }
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization"] }

[dev-dependencies]
tempfile = "3.27.0"
